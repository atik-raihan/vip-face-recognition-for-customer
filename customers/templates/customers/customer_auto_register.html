{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static "customers/customer_auto_register.css" %}">
{% endblock %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="row">

        <div class="col-lg-5">

            <div class="card shadow">

                <div class="card-header">
                    <h4>AI Customer Registration</h4>
                </div>

                <div class="card-body">

                    <form id="customer-form">

                        <div class="mb-3">
                            <label class="form-label">Customer Name</label>
                            <input
                                type="text"
                                id="customer_name"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input
                                type="text"
                                id="phone"
                                class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input
                                type="email"
                                id="email"
                                class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea
                                id="address"
                                rows="3"
                                class="form-control"></textarea>
                        </div>

                        <button
                            id="save-btn"
                            type="button"
                            class="btn btn-success w-100 btn-lg"
                            disabled>

                            Save Customer

                        </button>

                    </form>

                </div>

            </div>

        </div>

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-header">
                    <h4>Live AI Camera</h4>
                </div>

                <div class="card-body text-center">

                    <div id="camera-wrapper">

                        <img
                            id="camera-stream"
                            src="{% url 'video_feed' %}"
                            class="img-fluid rounded border">

                        <div id="overlay">

                            <div id="status">

                                Looking for a face...

                            </div>

                            <div id="countdown"></div>

                            <div id="face-box"></div>

                        </div>

                    </div>

                    <div class="mt-4">

                        <img
                            id="captured-image"
                            class="img-fluid rounded border"
                            style="display:none;">

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block extra_js %}

<script src="{% static "customers/customer_auto_register.js" %}"></script>

{% endblock %}
