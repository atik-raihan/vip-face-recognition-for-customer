{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card">

        <div class="card-header bg-primary text-white">
            <h3>Point of Sale (POS)</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="row mb-3">

                    <div class="col-md-6">

                        <label>Customer</label>

                        <select
                            name="customer"
                            id="customer"
                            class="form-control">

                            {% for customer in customers %}

                            <option value="{{ customer.id }}">
                                {{ customer.name }} - {{ customer.phone }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-4">

                        <label>Product</label>

                        <select
                            id="product"
                            class="form-control">

                            <option value="">Select Product</option>

                            {% for product in products %}

                            <option value="{{ product.id }}">
                                {{ product.name }} - ৳{{ product.price }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-2">

                        <label>&nbsp;</label>

                        <button
                            type="button"
                            onclick="addProduct()"
                            class="btn btn-success w-100">

                            Add

                        </button>

                    </div>

                </div>

                <input
                    type="hidden"
                    name="items"
                    id="items">

                <table class="table table-bordered">

                    <thead>

                        <tr>

                            <th>Product</th>
                            <th>Price</th>
                            <th width="180">Quantity</th>
                            <th>Subtotal</th>
                            <th width="120">Action</th>

                        </tr>

                    </thead>

                    <tbody id="cart">

                    </tbody>

                </table>

                <h3 class="text-end">

                    Total:
                    ৳<span id="total">0.00</span>

                </h3>

                <button class="btn btn-primary">

                    Complete Sale

                </button>

            </form>

        </div>

    </div>

</div>

<script>

let cart = [];

function renderCart(){

    let html = "";
    let total = 0;

    cart.forEach((item,index)=>{

        let subtotal = item.price * item.qty;

        total += subtotal;

        html += `
        <tr>

            <td>${item.name}</td>

            <td>৳${item.price.toFixed(2)}</td>

            <td>

                <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    onclick="decrease(${index})">

                    -

                </button>

                <span class="mx-2">${item.qty}</span>

                <button
                    type="button"
                    class="btn btn-success btn-sm"
                    onclick="increase(${index})">

                    +

                </button>

            </td>

            <td>৳${subtotal.toFixed(2)}</td>

            <td>

                <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    onclick="removeItem(${index})">

                    Remove

                </button>

            </td>

        </tr>
        `;

    });

    document.getElementById("cart").innerHTML = html;

    document.getElementById("total").innerHTML = total.toFixed(2);

    document.getElementById("items").value = JSON.stringify(

        cart.map(item => ({
            id: item.id,
            qty: item.qty
        }))

    );

}

function addProduct(){

    let id = document.getElementById("product").value;

    if(id=="") return;

    fetch("/pos/product/?id="+id)

    .then(response => response.json())

    .then(data => {

        let existing = cart.find(item => item.id == data.id);

        if(existing){

            if(existing.qty < data.stock){

                existing.qty++;

            }else{

                alert("Not enough stock!");

            }

        }else{

            cart.push({

                id: data.id,
                name: data.name,
                price: data.price,
                qty: 1,
                stock: data.stock

            });

        }

        renderCart();

    });

}

function increase(index){

    if(cart[index].qty < cart[index].stock){

        cart[index].qty++;

        renderCart();

    }else{

        alert("Stock limit reached!");

    }

}

function decrease(index){

    cart[index].qty--;

    if(cart[index].qty <= 0){

        cart.splice(index,1);

    }

    renderCart();

}

function removeItem(index){

    cart.splice(index,1);

    renderCart();

}

</script>


<!-- ============================================================ -->
<!-- AI RECOGNITION: Welcome Back modal + auto-select customer     -->
<!-- ============================================================ -->

<div id="welcome-back-modal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
z-index:9999;
justify-content:center;
align-items:center;
">

<div style="
background:white;
width:430px;
border-radius:18px;
padding:35px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.35);
animation:popup .35s;
">

<div style="font-size:55px;">👋</div>

<img
    id="wb-photo"
    src=""
    style="
        width:120px;
        height:120px;
        border-radius:50%;
        object-fit:cover;
        border:4px solid #198754;
        margin-bottom:15px;
    "
>

<h2 style="margin-top:10px;">
Welcome Back
</h2>

<h1
id="wb-customer-name"
style="
margin-top:10px;
font-size:36px;
font-weight:bold;
color:#222;
">
</h1>

<div
id="wb-vip-badge"
style="
display:none;
font-size:20px;
font-weight:bold;
color:#d4a017;
margin-top:10px;
">
👑 VIP CUSTOMER
</div>

<hr>

<div style="font-size:18px;color:#666;">
Total Purchase
</div>

<div
id="wb-total-purchase"
style="
font-size:40px;
font-weight:bold;
color:#198754;
margin-top:8px;
">
</div>

<div
id="wb-confidence"
style="
margin-top:18px;
color:#888;
">
</div>

</div>

</div>

<style>

@keyframes popup{

0%{

transform:scale(.6);
opacity:0;

}

100%{

transform:scale(1);
opacity:1;

}

}

</style>

<script>
(function () {

    const CUSTOMER_SELECT_ID = "customer";
    const LATEST_RECOGNITION_URL = "/camera/latest-recognition/";

    const POLL_INTERVAL_MS = 3000;

    let lastSeenLogId = sessionStorage.getItem("lastRecognitionId");

    if (lastSeenLogId) {
        lastSeenLogId = parseInt(lastSeenLogId);
    } else {
        lastSeenLogId = null;
    }

    function closeWelcomeBackModal() {

        document.getElementById(
            "welcome-back-modal"
        ).style.display = "none";

    }

    window.closeWelcomeBackModal = closeWelcomeBackModal;

    function showWelcomeBackModal(data) {

    document.getElementById("wb-photo").src =
        data.photo || "/static/images/default-user.png";
    

    document.getElementById("wb-customer-name").innerHTML =
        data.customer_name;

    document.getElementById("wb-total-purchase").innerHTML =
        "৳" + Number(data.total_purchase).toFixed(2);

    document.getElementById("wb-confidence").innerHTML =
        "Recognition " + (Number(data.confidence) * 100).toFixed(1) + "%";

    document.getElementById("wb-vip-badge").style.display =
        data.is_vip ? "block" : "none";

    document.getElementById("welcome-back-modal").style.display = "flex";

    clearTimeout(window.popupTimer);

    window.popupTimer = setTimeout(function () {

        document.getElementById("welcome-back-modal").style.display = "none";

    }, 3000);

}

    function autoSelectCustomer(customerId) {

        const select = document.getElementById(
            CUSTOMER_SELECT_ID
        );

        if (!select)
            return;

        select.value = customerId;

        select.dispatchEvent(
            new Event("change", {
                bubbles: true
            })
        );

    }

    async function pollRecognition() {

        try {

            let url = LATEST_RECOGNITION_URL;

            if (lastSeenLogId !== null) {
                url += "?since_id=" + lastSeenLogId;
            }

            const response = await fetch(url);

            if (!response.ok) return;

            const data = await response.json();

            if (!data.new) return;

            lastSeenLogId = data.log_id;

            sessionStorage.setItem(
                "lastRecognitionId",
                lastSeenLogId
            );

            autoSelectCustomer(data.customer_id);

            showWelcomeBackModal(data);

        } catch (error) {

            console.error(error);

        }

    }

    pollRecognition();

    setInterval(
        pollRecognition,
        POLL_INTERVAL_MS
    );

})();

</script>

{% endblock %}
