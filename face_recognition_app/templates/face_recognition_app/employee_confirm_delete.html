{% extends "base.html" %}

{% block content %}
<div class="container-fluid">

    <div class="card">

        <div class="card-header bg-danger text-white">
            <h3>Delete Employee</h3>
        </div>

        <div class="card-body">

            <p>Are you sure you want to delete <strong>{{ employee.name }}</strong> ({{ employee.employee_id }})?</p>
            <p class="text-muted small">This will also remove their attendance history.</p>

            <form method="POST">
                {% csrf_token %}
                <button class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'employee_list' %}" class="btn btn-secondary">Cancel</a>
            </form>

        </div>

    </div>

</div>
{% endblock %}
