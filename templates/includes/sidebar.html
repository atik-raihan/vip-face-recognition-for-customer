{% load static %}

<aside class="main-sidebar sidebar-dark-primary elevation-4">

    <!-- Brand -->
    <a href="{% url 'recognition_dashboard' %}" class="brand-link">
        <img src="{% static 'img/logo.png' %}"
             class="brand-image img-circle elevation-3"
             style="opacity:.8">

        <span class="brand-text font-weight-light">
            VIP Recognition
        </span>
    </a>

    <div class="sidebar">

        <!-- User -->
        <div class="user-panel mt-3 pb-3 mb-3 d-flex">

            <div class="image">
                <img src="{% static 'img/user.png' %}"
                     class="img-circle elevation-2"
                     alt="User">
            </div>

            <div class="info">
                <a href="/admin/" class="d-block">
                    {{ request.user.username }}
                </a>
            </div>

        </div>

        <!-- Sidebar Menu -->
        <nav class="mt-2">

            <ul class="nav nav-pills nav-sidebar flex-column"
                data-widget="treeview"
                role="menu"
                data-accordion="false">

                <!-- Dashboard -->
                <li class="nav-item">
                    <a href="{% url 'recognition_dashboard' %}" class="nav-link">
                        <i class="nav-icon fas fa-home"></i>
                        <p>Dashboard</p>
                    </a>
                </li>

                <!-- Live Camera -->
                <li class="nav-item">
                    <a href="{% url 'camera' %}" class="nav-link">
                        <i class="nav-icon fas fa-video"></i>
                        <p>Live Camera</p>
                    </a>
                </li>

                <!-- Recognition Logs -->
                <li class="nav-item">
                    <a href="{% url 'recognition_dashboard' %}" class="nav-link">
                        <i class="nav-icon fas fa-history"></i>
                        <p>Recognition Logs</p>
                    </a>
                </li>

                <!-- Customers -->
                <li class="nav-item">
                    <a href="{% url 'customer_list' %}" class="nav-link">
                        <i class="nav-icon fas fa-users"></i>
                        <p>Customers</p>
                    </a>
                </li>

                <!-- VIP Customers -->
                <li class="nav-item">
                    <a href="{% url 'customer_list' %}" class="nav-link">
                        <i class="nav-icon fas fa-star"></i>
                        <p>VIP Customers</p>
                    </a>
                </li>

                <!-- Products -->
                <li class="nav-item">
                    <a href="{% url 'product_list' %}" class="nav-link">
                        <i class="nav-icon fas fa-box"></i>
                        <p>Products</p>
                    </a>
                </li>

                <!-- POS -->
                <li class="nav-item">
                    <a href="{% url 'pos' %}" class="nav-link">
                        <i class="nav-icon fas fa-cash-register"></i>
                        <p>POS</p>
                    </a>
                </li>

                <!-- Sales History -->
                <li class="nav-item">
                    <a href="{% url 'sales_history' %}" class="nav-link">
                        <i class="nav-icon fas fa-file-invoice-dollar"></i>
                        <p>Sales History</p>
                    </a>
                </li>

                <!-- Reports -->
                <li class="nav-item">
                    <a href="{% url 'reports' %}" class="nav-link">
                        <i class="nav-icon fas fa-chart-line"></i>
                        <p>Reports</p>
                    </a>
                </li>

                <!-- Employees -->
                <li class="nav-item">
                    <a href="{% url 'employee_list' %}" class="nav-link">
                        <i class="nav-icon fas fa-user-tie"></i>
                        <p>Employees</p>
                    </a>
                </li>

                <!-- Attendance -->
                <li class="nav-item">
                    <a href="{% url 'attendance_dashboard' %}" class="nav-link">
                        <i class="nav-icon fas fa-calendar-check"></i>
                        <p>Attendance</p>
                    </a>
                </li>

                <!-- Branches -->
                <li class="nav-item">
                    <a href="{% url 'branch_list' %}" class="nav-link">
                        <i class="nav-icon fas fa-building"></i>
                        <p>Branches</p>
                    </a>
                </li>

                <!-- Settings -->
                <li class="nav-item">
                    <a href="{% url 'recognition_settings' %}" class="nav-link">
                        <i class="nav-icon fas fa-cog"></i>
                        <p>Settings</p>
                    </a>
                </li>

                <!-- Django Admin -->
                <li class="nav-item">
                    <a href="/admin/" class="nav-link">
                        <i class="nav-icon fas fa-user-shield"></i>
                        <p>Django Admin</p>
                    </a>
                </li>

                <!-- Logout -->
                <li class="nav-item">
                    <a href="{% url 'logout' %}" class="nav-link">
                        <i class="nav-icon fas fa-sign-out-alt"></i>
                        <p>Logout</p>
                    </a>
                </li>

            </ul>

        </nav>

    </div>

</aside>
